<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<g id="title"><text x="64" y="92" font-family="Microsoft YaHei" font-size="40" font-weight="700" fill="#18324F">下一步计划与阶段交付</text></g>
<g id="native-table">
<rect x="64" y="154" width="1152" height="52" fill="#F3F6FA"/>
<text x="82" y="190" font-family="Microsoft YaHei" font-size="24" font-weight="700" fill="#18324F">阶段</text><text x="394" y="190" font-family="Microsoft YaHei" font-size="24" font-weight="700" fill="#18324F">重点工作</text><text x="832" y="190" font-family="Microsoft YaHei" font-size="24" font-weight="700" fill="#18324F">阶段交付</text>
<text x="82" y="246" font-family="Microsoft YaHei" font-size="24" font-weight="700" fill="#263444">1．明确交付范围</text><text x="82" y="280" font-family="Microsoft YaHei" font-size="24" font-weight="700" fill="#263444">与协作规范</text>
<text x="394" y="240" font-family="Microsoft YaHei" font-size="24" fill="#263444">确定首次可用功能及验收标准，</text><text x="394" y="274" font-family="Microsoft YaHei" font-size="24" fill="#263444">统一数据与接口格式</text>
<text x="832" y="240" font-family="Microsoft YaHei" font-size="24" fill="#2166AC">功能清单、接口约定、</text><text x="832" y="274" font-family="Microsoft YaHei" font-size="24" fill="#2166AC">公共样例数据</text>
<line x1="64" y1="302" x2="1216" y2="302" stroke="#D4DEE8" stroke-width="1"/>
<text x="82" y="342" font-family="Microsoft YaHei" font-size="24" font-weight="700" fill="#263444">2．完成数据</text><text x="82" y="376" font-family="Microsoft YaHei" font-size="24" font-weight="700" fill="#263444">与模型基线</text>
<text x="394" y="328" font-family="Microsoft YaHei" font-size="24" fill="#263444">跑通数据采集、标注、特征提取</text><text x="394" y="360" font-family="Microsoft YaHei" font-size="24" fill="#263444">和基线评估，逐步扩展模型实验</text>
<text x="832" y="328" font-family="Microsoft YaHei" font-size="24" fill="#2166AC">可复现的数据处理流程、</text><text x="832" y="362" font-family="Microsoft YaHei" font-size="24" fill="#2166AC">模型与评估报告</text>
<line x1="64" y1="398" x2="1216" y2="398" stroke="#D4DEE8" stroke-width="1"/>
<text x="82" y="452" font-family="Microsoft YaHei" font-size="24" font-weight="700" fill="#263444">3．完成系统联调</text>
<text x="394" y="432" font-family="Microsoft YaHei" font-size="24" fill="#263444">连接仓库接入、预测、风险解释</text><text x="394" y="466" font-family="Microsoft YaHei" font-size="24" fill="#263444">与审查记录功能</text>
<text x="832" y="452" font-family="Microsoft YaHei" font-size="24" fill="#2166AC">可运行的完整使用流程</text>
<line x1="64" y1="494" x2="1216" y2="494" stroke="#D4DEE8" stroke-width="1"/>
<text x="82" y="548" font-family="Microsoft YaHei" font-size="24" font-weight="700" fill="#263444">4．开展场景验证</text>
<text x="394" y="528" font-family="Microsoft YaHei" font-size="24" fill="#263444">邀请课程团队试用，收集反馈</text><text x="394" y="562" font-family="Microsoft YaHei" font-size="24" fill="#263444">并检查模型适用性</text>
<text x="832" y="528" font-family="Microsoft YaHei" font-size="24" fill="#2166AC">试用记录、问题清单</text><text x="832" y="562" font-family="Microsoft YaHei" font-size="24" fill="#2166AC">与改进计划</text>
</g>
<g id="closing"><text x="64" y="638" font-family="Microsoft YaHei" font-size="28" font-weight="700" fill="#18324F">下一阶段重点是完成首个可用流程，</text><text x="64" y="680" font-family="Microsoft YaHei" font-size="28" font-weight="700" fill="#18324F">并验证预测结果能否帮助课程团队开展代码审查。</text><text x="1188" y="684" font-family="Microsoft YaHei" font-size="20" fill="#617286">08</text></g>
</svg>
