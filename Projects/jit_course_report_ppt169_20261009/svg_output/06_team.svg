<text x="642" y="245" font-family="Microsoft YaHei" font-size="24" fill="#263444">Git仓库解析、SZZ、Kamei 14维特征、</text><text x="642" y="279" font-family="Microsoft YaHei" font-size="24" fill="#263444">数据清洗与持久化、训练集构建</text>
