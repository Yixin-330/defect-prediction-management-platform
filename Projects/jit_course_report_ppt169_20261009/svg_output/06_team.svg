<text x="82" y="587" font-family="Microsoft YaHei" font-size="24" font-weight="700" fill="#263444">D．前端与产品工程师</text><text x="82" y="623" font-family="Microsoft YaHei" font-size="24" fill="#2166AC">张欣悦</text>
<text x="402" y="587" font-family="Microsoft YaHei" font-size="24" fill="#263444">可视化、</text><text x="402" y="623" font-family="Microsoft YaHei" font-size="24" fill="#263444">产品体验</text>
