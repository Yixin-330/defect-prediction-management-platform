<text x="642" y="354" font-family="Microsoft YaHei" font-size="24" fill="#263444">至少8个模型（经典ML与DL）、两类</text><text x="642" y="388" font-family="Microsoft YaHei" font-size="24" fill="#263444">评估指标、数据划分、模型对比选型、</text><text x="642" y="422" font-family="Microsoft YaHei" font-size="24" fill="#263444">SHAP等解释</text>
