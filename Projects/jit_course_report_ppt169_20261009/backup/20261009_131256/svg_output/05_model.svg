<text x="300" y="247" font-family="Microsoft YaHei" font-size="28" fill="#6D8299">→</text>
<text x="374" y="230" font-family="Microsoft YaHei" font-size="24" fill="#263444">SZZ标注</text><text x="374" y="266" font-family="Microsoft YaHei" font-size="24" fill="#263444">与特征构建</text>
<text x="610" y="247" font-family="Microsoft YaHei" font-size="28" fill="#6D8299">→</text>
<text x="684" y="230" font-family="Microsoft YaHei" font-size="24" fill="#263444">多模型训练</text><text x="684" y="266" font-family="Microsoft YaHei" font-size="24" fill="#263444">与评估</text>
<text x="922" y="247" font-family="Microsoft YaHei" font-size="28" fill="#6D8299">→</text>
<text x="994" y="230" font-family="Microsoft YaHei" font-size="24" fill="#2166AC">模型选型</text><text x="994" y="266" font-family="Microsoft YaHei" font-size="24" fill="#2166AC">与保存</text>
</g>
<g id="model-link"><polyline points="1126,286 1126,325 830,325 830,375" fill="none" stroke="#6D8299" stroke-width="2" marker-end="url(#arrow)"/><text x="854" y="361" font-family="Microsoft YaHei" font-size="20" fill="#617286">保存的模型供在线调用</text></g>
<g id="online">
<text x="64" y="354" font-family="Microsoft YaHei" font-size="28" font-weight="700" fill="#2166AC">在线预测</text>
<text x="64" y="410" font-family="Microsoft YaHei" font-size="24" fill="#263444">课程项目</text><text x="64" y="446" font-family="Microsoft YaHei" font-size="24" fill="#263444">的新提交</text>
<text x="300" y="427" font-family="Microsoft YaHei" font-size="28" fill="#6D8299">→</text>
<text x="374" y="410" font-family="Microsoft YaHei" font-size="24" fill="#263444">同规则</text><text x="374" y="446" font-family="Microsoft YaHei" font-size="24" fill="#263444">特征提取</text>
<text x="610" y="427" font-family="Microsoft YaHei" font-size="28" fill="#6D8299">→</text>
<text x="684" y="410" font-family="Microsoft YaHei" font-size="24" fill="#263444">已训练模型</text><text x="684" y="446" font-family="Microsoft YaHei" font-size="24" fill="#263444">预测</text>
