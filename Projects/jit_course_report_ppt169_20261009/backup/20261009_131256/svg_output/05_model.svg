<g id="principles"><line x1="64" y1="495" x2="1216" y2="495" stroke="#D4DEE8" stroke-width="1"/><text x="64" y="543" font-family="Microsoft YaHei" font-size="24" font-weight="700" fill="#18324F">训练与预测共用特征提取规则。</text><text x="684" y="543" font-family="Microsoft YaHei" font-size="24" font-weight="700" fill="#18324F">预测只使用提交当时可获得的信息。</text>
<text x="64" y="605" font-family="Microsoft YaHei" font-size="24" fill="#263444">模型提前训练，用户使用时直接调用。</text><text x="64" y="644" font-family="Microsoft YaHei" font-size="24" fill="#263444">开源数据上的评估表现，需要进一步通过课程项目试用验证。</text></g>
<text x="1188" y="684" font-family="Microsoft YaHei" font-size="20" fill="#617286">05</text>
