<text x="64" y="580" font-family="Microsoft YaHei" font-size="24" fill="#2166AC">连接课程</text><text x="64" y="613" font-family="Microsoft YaHei" font-size="24" fill="#2166AC">项目仓库</text>
<text x="220" y="596" font-family="Microsoft YaHei" font-size="24" fill="#6D8299">→</text>
<text x="268" y="580" font-family="Microsoft YaHei" font-size="24" fill="#263444">分析每次</text><text x="268" y="613" font-family="Microsoft YaHei" font-size="24" fill="#263444">提交</text>
<text x="425" y="596" font-family="Microsoft YaHei" font-size="24" fill="#6D8299">→</text>
<text x="473" y="580" font-family="Microsoft YaHei" font-size="24" fill="#263444">发现高风险</text><text x="473" y="613" font-family="Microsoft YaHei" font-size="24" fill="#263444">变更</text>
<text x="630" y="596" font-family="Microsoft YaHei" font-size="24" fill="#6D8299">→</text>
<text x="678" y="580" font-family="Microsoft YaHei" font-size="24" fill="#263444">解释风险</text><text x="678" y="613" font-family="Microsoft YaHei" font-size="24" fill="#263444">来源</text>
