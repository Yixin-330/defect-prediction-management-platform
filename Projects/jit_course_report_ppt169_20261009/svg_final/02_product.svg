<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<g id="title"><text x="64" y="92" font-family="Microsoft YaHei" font-size="40" font-weight="700" fill="#18324F">产品定位与产品主线</text></g>
<g id="positioning">
<text x="64" y="159" font-family="Microsoft YaHei" font-size="24" fill="#263444">面向代码审查资源有限的开发团队，首批聚焦高校软件工程课程团队。</text>
<text x="64" y="198" font-family="Microsoft YaHei" font-size="24" fill="#263444">基于真实开源项目训练JIT缺陷预测模型，对提交进行风险预测、解释与优先级排序，</text>
<text x="64" y="237" font-family="Microsoft YaHei" font-size="24" fill="#263444">辅助学生团队建立规范的代码审查流程，为教师提供项目质量趋势参考。</text>
</g>
<g id="native-table">
<rect x="64" y="274" width="1152" height="48" fill="#F3F6FA"/>
<text x="82" y="307" font-family="Microsoft YaHei" font-size="24" font-weight="700" fill="#18324F">核心用户</text><text x="356" y="307" font-family="Microsoft YaHei" font-size="24" font-weight="700" fill="#18324F">使用目的</text>
<text x="82" y="359" font-family="Microsoft YaHei" font-size="24" fill="#263444">学生开发者</text><text x="356" y="359" font-family="Microsoft YaHei" font-size="24" fill="#263444">查看自己提交的风险并改进代码</text>
<text x="82" y="411" font-family="Microsoft YaHei" font-size="24" fill="#263444">项目负责人</text><text x="356" y="411" font-family="Microsoft YaHei" font-size="24" fill="#263444">安排代码审查，了解团队整体风险</text>
<text x="82" y="463" font-family="Microsoft YaHei" font-size="24" fill="#263444">教师或助教</text><text x="356" y="463" font-family="Microsoft YaHei" font-size="24" fill="#263444">查看各小组的项目质量趋势，及时提供指导</text>
<line x1="64" y1="478" x2="1216" y2="478" stroke="#D4DEE8" stroke-width="1"/>
</g>
